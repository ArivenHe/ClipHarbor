name: ClipHarbor
options:
  deploymentTarget:
    macOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: '26.0'
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: '-'
targets:
  ClipHarbor:
    type: application
    platform: macOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arivenhe.ClipHarbor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 拾贴
        INFOPLIST_KEY_LSUIElement: YES
        MARKETING_VERSION: 0.1.1
        CURRENT_PROJECT_VERSION: 2
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
  ClipHarborTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: ClipHarbor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ClipHarbor:
    build:
      targets:
        ClipHarbor: all
        ClipHarborTests: [test]
    test:
      targets: [ClipHarborTests]
