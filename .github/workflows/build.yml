name: Build and Release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          if ! xcodebuild -version | head -1 | grep -q 'Xcode 26'; then
            XCODE_PATH=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
            test -n "$XCODE_PATH"
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          fi
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project and test
        run: |
          xcodegen generate
          xcodebuild -project ClipHarbor.xcodeproj -scheme ClipHarbor -destination 'platform=macOS' -derivedDataPath build/test CODE_SIGNING_ALLOWED=NO test
      - name: Import optional Developer ID certificate
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE" ]; then exit 0; fi
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/signing.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERT_PASSWORD" -k "$RUNNER_TEMP/signing.keychain-db" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/signing.keychain-db" login.keychain-db
      - name: Build universal app and package
        env:
          SIGNING_IDENTITY: ${{ startsWith(github.ref, 'refs/tags/') && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ClipHarbor-macOS-universal
          path: build/dist/*
      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12"
          if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/signing.keychain-db"; fi
  windows:
    name: Windows ${{ matrix.architecture }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test Windows core
        run: dotnet test windows/ClipHarbor.Core.Tests/ClipHarbor.Core.Tests.csproj -c Release --logger "trx;LogFileName=windows-core.trx"
      - name: Build WinUI 3 portable app
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Architecture '${{ matrix.architecture }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ClipHarbor-Windows-${{ matrix.architecture }}
          path: build/windows-dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-test-results-${{ matrix.architecture }}
          path: windows/ClipHarbor.Core.Tests/TestResults/*.trx
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ClipHarbor-*
          merge-multiple: true
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --title "ClipHarbor $RELEASE_TAG" --generate-notes
